# Debian package builder for morph
# Builds .deb packages for Ubuntu/Debian users
name: Debian Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  CICD_INTERMEDIATES_DIR: "_cicd-intermediates"

jobs:
  crate_metadata:
    name: Extract crate metadata
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.crate_metadata.outputs.name }}
      version: ${{ steps.crate_metadata.outputs.version }}
      maintainer: ${{ steps.crate_metadata.outputs.maintainer }}
      homepage: ${{ steps.crate_metadata.outputs.homepage }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract crate information
        id: crate_metadata
        run: |
          echo "name=morph" | tee -a $GITHUB_OUTPUT
          cargo metadata --no-deps --format-version 1 | jq -r '"version=" + .packages[0].version' | tee -a $GITHUB_OUTPUT
          cargo metadata --no-deps --format-version 1 | jq -r '"maintainer=" + .packages[0].authors[0]' | tee -a $GITHUB_OUTPUT
          cargo metadata --no-deps --format-version 1 | jq -r '"homepage=" + .packages[0].homepage' | tee -a $GITHUB_OUTPUT

  build-deb:
    name: Build .deb (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: crate_metadata
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, use-cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, use-cross: true }
          - { target: i686-unknown-linux-gnu, os: ubuntu-24.04, use-cross: true }
    env:
      BUILD_CMD: "${{ matrix.use-cross && 'cross' || 'cargo' }}"
      target: ${{ matrix.target }}
      name: ${{ needs.crate_metadata.outputs.name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev
          case ${target} in
            arm-unknown-linux-*) sudo apt-get -y install gcc-arm-linux-gnueabihf ;;
            aarch64-unknown-linux-gnu) sudo apt-get -y install gcc-aarch64-linux-gnu ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        env:
          cross_version: "v0.2.5"
          package_name: "cross-x86_64-unknown-linux-gnu.tar.gz"
          GH_TOKEN: "${{ github.token }}"
        run: |
          dir="$HOME/.local/bin/"
          mkdir -p "$dir"
          gh release download --repo cross-rs/cross \
            --pattern "${package_name}" -O - "${cross_version}" \
            | tar -C "$dir" -xz
          echo "$dir" >> $GITHUB_PATH

      - name: Build
        shell: bash
        run: $BUILD_CMD build --locked --release --target="${target}"

      - name: Set binary path
        id: bin
        shell: bash
        run: |
          BIN_PATH="target/${target}/release/morph"
          echo "BIN_PATH=${BIN_PATH}" >> $GITHUB_OUTPUT

      - name: Create Debian package
        id: debian-package
        shell: bash
        run: bash scripts/create-deb.sh
        env:
          TARGET: ${{ matrix.target }}
          DPKG_VERSION: ${{ needs.crate_metadata.outputs.version }}
          BIN_PATH: ${{ steps.bin.outputs.BIN_PATH }}

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: ${{ steps.debian-package.outputs.DPKG_PATH }}
          compression-level: 0

      - name: Attest Debian package
        uses: actions/attest-build-provenance@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: ${{ steps.debian-package.outputs.DPKG_PATH }}

  publish-deb:
    name: Publish .deb packages to GitHub Release
    runs-on: ubuntu-latest
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: deb-packages
          merge-multiple: true

      - name: List packages
        run: ls -la deb-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deb-packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
